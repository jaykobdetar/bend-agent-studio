name: Studio checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Node, Bend and BendTT
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up alternate archived Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - name: Save archived runtime for the cross-version MCP test
        run: echo "BEND_MCP_TEST_OTHER_NODE=$(node -p 'process.execPath')" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
      - name: Check flat archive source hashes and bundle identities
        run: node tools/archive-gates.mjs check tools/archive-gates/m0-exceptions.json

      - name: Install Bend 2.0.40
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 -o bend.tar.gz https://github.com/bendlang/bend/releases/download/v2.0.40/bend-2.0.40-linux-x64.tar.gz
          echo 'c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b  bend.tar.gz' | sha256sum --check
          tar -xzf bend.tar.gz
          test "$(./bend/bin/bend version)" = 'bend 2.0.40'
          echo "$RUNNER_TEMP/bend/bin" >> "$GITHUB_PATH"

      - name: Check representative compiled archive backend hashes
        run: node tools/archive-gates.mjs check-backends
      - name: Run Node tests
        run: npm test
      - name: Reproduce two flagship checkpoint byte hashes
        run: node checks/flagship_slice.mjs
      - name: Exercise Studio manifest replay at 390 px
        working-directory: tools/studio-smoke
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps --no-shell chromium
          npm test
      - name: Check statistical comparisons and positive-exponent Bend literals
        run: |
          python3 -m unittest checks.test_multiple_comparisons checks.test_suite_stats
          node checks/world_campaign.mjs --bend bend --seed 30000 --worlds 2 --episodes 12 --batches 1
      - name: Verify two-pile Nim arena and every starting position
        run: |
          node experiment.mjs run experiments/two-pile-nim.json "$RUNNER_TEMP/nim-study"
          node checks/nim_checks.mjs "$RUNNER_TEMP/nim-study"
      - name: Verify both tic-tac-toe encodings and self-play updates
        run: |
          node experiment.mjs run experiments/self-play.json "$RUNNER_TEMP/self-play-study" --until 128
          node checks/arena_checks.mjs "$RUNNER_TEMP/self-play-study"
      - name: Test MCP with real Bend
        working-directory: mcp
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Verify pre-reorganization archives against current Studio and MCP
        run: bash tools/archive-gates/g4-hosted.sh "$PWD/tools/archive-gates/g4-hosted.mjs"

      - name: Verify optional Gymnasium adapter (checker, buckets, oracle, and compiled replay)
        working-directory: integrations/gymnasium
        run: |
          python3 -m venv "$RUNNER_TEMP/bend-gym-env"
          "$RUNNER_TEMP/bend-gym-env/bin/pip" install -r requirements.txt
          "$RUNNER_TEMP/bend-gym-env/bin/python" -m unittest -v
      - name: Verify optional local Minari HDF5 export
        run: |
          python3 -m venv "$RUNNER_TEMP/bend-minari-env"
          "$RUNNER_TEMP/bend-minari-env/bin/pip" install -r integrations/minari/requirements-lock.txt
          "$RUNNER_TEMP/bend-minari-env/bin/python" -m unittest discover -s integrations/minari -v
      - name: Run Bend checks
        run: |
          bend checks/checks.bend
          bend checks/benchmark_checks.bend
          bend checks/study_checks.bend
          bend agents/sarsa/checks.bend
          bend agents/n_step/checks.bend
          bend agents/td_lambda/checks.bend
          bend agents/reinforce/checks.bend
          bend agents/linear/checks.bend
          bend agents/clipped_pg/checks.bend
          bend laws/PROOF.bend

      - name: Install Lean 4.34.0 for the independent proof check
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 -o lean.tar.zst https://github.com/leanprover/lean4/releases/download/v4.34.0/lean-4.34.0-linux.tar.zst
          echo 'caaa98356098c85dc0fcbbd28e1ec66f39eb6551829972b752ff20e1286b646b  lean.tar.zst' | sha256sum --check
          tar --zstd -xf lean.tar.zst
          echo "$RUNNER_TEMP/lean-4.34.0-linux/bin" >> "$GITHUB_PATH"
      - name: Verify proofs with BendTT
        run: |
          bend laws/PROOF.bend --verdict
          bend agents/sarsa/proof.bend --verdict
          bend agents/n_step/proof.bend --verdict
          bend agents/td_lambda/proof.bend --verdict
          bend agents/reinforce/proof.bend --verdict
          bend agents/linear/proof.bend --verdict
          bend agents/clipped_pg/proof.bend --verdict
          BEND_CHECK_SCAFFOLD_VERDICT=1 node --test checks/scaffold_checks.mjs

  fresh-setup:
    name: Fresh devcontainer and zero-skip tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the developer image
        run: docker build -f .devcontainer/Dockerfile -t bend-studio-dev .devcontainer
      - name: Run post-create setup and tests as the developer user
        shell: bash
        run: |
          git archive HEAD | docker run --rm -i bend-studio-dev bash -e -o pipefail -c '
            mkdir "$HOME/checkout"
            cd "$HOME/checkout"
            tar -xf -
            python3.12 -c "import json, subprocess; command = json.load(open(\".devcontainer/devcontainer.json\"))[\"postCreateCommand\"]; subprocess.run([\"bash\", \"-c\", command], check=True)"
            exec bash scripts/check-setup.sh
          '

  windows:
    name: Node-only checks on Windows
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
      - name: Check flat archive source hashes and bundle identities
        run: node tools/archive-gates.mjs check tools/archive-gates/m0-exceptions.json
      - run: npm test
      - name: MCP protocol and process tests
        working-directory: mcp
        run: |
          npm ci --ignore-scripts
          npm test
